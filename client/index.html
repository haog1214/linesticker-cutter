<!doctype html>
<html lang="zh-TW">

  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        if (/Line\//i.test(navigator.userAgent)) {
          var url = location.href;
          if (url.indexOf('openExternalBrowser') === -1) {
            location.replace(url + (url.indexOf('?') === -1 ? '?' : '&') + 'openExternalBrowser=1');
          }
        }
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LINE 貼圖裁切去背神器</title>    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字型非同步載入：Google 字型被擋或很慢時，頁面不會整個卡在白屏 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>

  <body>
    <div id="root">
      <!-- React 啟動後會取代這段；伺服器喚醒或網路慢時先顯示 -->
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#64748b;text-align:center;padding:16px">
        <div style="font-size:18px;font-weight:600;color:#0ea5e9">LINE 貼圖裁切去背神器</div>
        <div style="font-size:14px">載入中，請稍候…</div>
        <div style="font-size:12px">若超過 30 秒仍未出現，請重新整理頁面</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
